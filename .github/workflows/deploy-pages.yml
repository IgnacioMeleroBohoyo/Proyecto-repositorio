name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Set API URL
        working-directory: frontend
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          sed -i "s|__API_URL__|$API_URL|g" src/environments/environment.production.ts

      - name: Build Angular app
        working-directory: frontend
        run: |
          sed -i "s|__REPOSITORY_NAME__|${{ github.event.repository.name }}|g" angular.json
          npx ng build --configuration production,github-pages

      - name: Support Angular routes on Pages
        run: cp frontend/dist/demo-frontend/index.html frontend/dist/demo-frontend/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/demo-frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

